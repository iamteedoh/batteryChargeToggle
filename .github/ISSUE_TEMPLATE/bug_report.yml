name: Bug report
description: Report a reproducible batteryChargeToggle problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not paste tokens, passwords,
        SSH keys, or private host details.

  - type: input
    id: version
    attributes:
      label: batteryChargeToggle version
      description: Provide a release tag or commit SHA.
      placeholder: v0.1.0 or 0123456
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Charge threshold toggling
        - Battery status report (--status)
        - Hardware or threshold-support detection
        - Root/sudo handling
        - CI or release automation
        - Documentation
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Laptop platform
      options:
        - ThinkPad
        - ASUS
        - Huawei
        - MacBook running Linux
        - Other Linux laptop
        - Not hardware-specific
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your Linux distribution, kernel version, laptop model, and the contents of `ls /sys/class/power_supply/`. Redact private details.
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Observe ...
        3. Expected ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted output
      description: Remove secrets and private infrastructure details before pasting.
      render: shell
